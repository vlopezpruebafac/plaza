<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plaza Cashless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#11151b;
  --panel:#1a2029;
  --panel-2:#212934;
  --line:#2a3340;
  --text:#eceef1;
  --muted:#8b93a3;
  --brand:#d9a441;
  --brand-2:#b98730;
  --libre:#3fae5b;
  --libre-dim:#1e3a27;
  --ocupada:#d64545;
  --ocupada-dim:#3a1f1f;
  --info:#4b8fd6;
  --danger:#d64545;
  --radius:10px;
  --font-head:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;font-weight:600;}
button{font-family:var(--font-body);cursor:pointer;}
input,select{font-family:var(--font-body);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

.hidden{display:none !important;}

/* ============================================================
   BOTONES / GENERALES
   ============================================================ */
.btn{
  border:1px solid var(--line); background:var(--panel-2); color:var(--text);
  padding:10px 16px; border-radius:8px; font-size:14px; font-weight:600;
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:active{transform:scale(.97);}
.btn:hover{border-color:var(--brand);}
.btn-brand{background:var(--brand); border-color:var(--brand); color:#1a1305;}
.btn-brand:hover{background:var(--brand-2);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:rgba(214,69,69,.12);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.badge-libre{background:var(--libre-dim);color:var(--libre);}
.badge-ocupada{background:var(--ocupada-dim);color:var(--ocupada);}
.badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}

label.field{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600;}
input.input, select.input{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--text); font-size:14.5px;
}
input.input:focus, select.input:focus{outline:none;border-color:var(--brand);}

.toast-wrap{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--panel-2); border:1px solid var(--line); padding:10px 18px; border-radius:100px; font-size:13.5px; display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:toastIn .2s ease;}
.toast.ok{border-color:var(--libre); color:var(--libre);}
.toast.err{border-color:var(--danger); color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* Check animado */
.check-anim{width:46px;height:46px;border-radius:50%;background:var(--libre-dim);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.check-anim svg{width:26px;height:26px;}
.check-anim path{stroke:var(--libre);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .35s ease forwards;}
@keyframes drawCheck{to{stroke-dashoffset:0;}}
@keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
.pop{animation:popIn .28s ease;}

/* ============================================================
   LOGIN
   ============================================================ */
#screen-login{
  height:100%; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 20%, #1c2431 0%, var(--bg) 60%);
}
.login-card{width:360px; max-width:92vw; padding:34px 30px; text-align:center;}
.login-card .plaza-tag{color:var(--muted); font-size:12.5px; letter-spacing:.02em; margin-bottom:4px;}
.login-card h1{font-size:26px; margin-bottom:22px;}
.login-card .rest-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.role-btns{display:flex; flex-direction:column; gap:10px; margin-top:22px;}
.role-btns .btn{padding:14px; font-size:15px;}

/* Selector de mesero */
.mesero-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
.mesero-tile{padding:18px 10px; text-align:center; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel-2);}
.mesero-tile:hover{border-color:var(--brand);}
.mesero-tile .avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#1a1305;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 8px;}

/* ============================================================
   MAPA (pantalla principal del mesero)
   ============================================================ */
#screen-mapa{height:100%; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); z-index:5;
}
.topbar .rest-name{font-family:var(--font-head); font-size:15px;}
.topbar .who{font-size:12px; color:var(--muted);}
.topbar-actions{display:flex; gap:8px; align-items:center;}
#canvas-wrap{flex:1; position:relative;}
#three-canvas{display:block; width:100%; height:100%; touch-action:none;}

.map-legend{position:absolute; left:14px; bottom:14px; display:flex; gap:14px; background:rgba(26,32,41,.9); border:1px solid var(--line); padding:8px 14px; border-radius:100px; font-size:12px;}
.map-legend span{display:flex; align-items:center; gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;}

.fab{position:absolute; right:16px; bottom:16px; z-index:6;}
.mode-banner{
  position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6;
  background:var(--brand); color:#1a1305; padding:10px 18px; border-radius:100px; font-size:13.5px; font-weight:600;
  display:flex; gap:12px; align-items:center; box-shadow:0 8px 20px rgba(0,0,0,.4);
}

/* ============================================================
   MODALES
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(9,11,15,.65); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
}
.modal{
  width:420px; max-width:100%; max-height:88vh; overflow-y:auto; padding:22px 22px 24px;
  animation:popIn .18s ease;
}
.modal.wide{width:560px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.modal-head h3{font-size:18px;}
.modal-close{background:none; border:none; color:var(--muted); font-size:20px; line-height:1;}
.modal-sub{color:var(--muted); font-size:13px; margin-top:2px;}

/* Sillas dentro del modal de mesa */
.sillas-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; margin-top:14px;}
.silla-tile{border:1px dashed var(--line); border-radius:10px; padding:12px 8px; text-align:center; background:var(--panel-2);}
.silla-tile.ocupada{border-style:solid; border-color:var(--brand);}
.silla-tile .ico{font-size:20px;}
.silla-tile .nom{font-size:12px; margin-top:4px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.silla-tile .nfc-chip{font-size:9.5px; color:var(--muted); margin-top:2px;}

.linea-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.linea-item:last-child{border-bottom:none;}
.linea-item .qty{color:var(--muted); font-size:12px;}
.total-row{display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:2px solid var(--line); font-weight:700; font-size:16px;}

.cuenta-tab{padding:8px 14px; border-radius:100px; border:1px solid var(--line); background:var(--panel-2); font-size:12.5px; font-weight:600;}
.cuenta-tab.active{background:var(--brand); border-color:var(--brand); color:#1a1305;}

.nfc-scan-box{border:1.5px dashed var(--line); border-radius:12px; padding:20px; text-align:center; margin-top:14px;}
.nfc-pulse{width:56px;height:56px;border-radius:50%;background:var(--info);opacity:.15;margin:0 auto 10px;position:relative;}
.nfc-pulse::after{content:"📡";position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; opacity:1;}
.nfc-pulse.scanning{animation:pulseA 1.1s ease-in-out infinite;}
@keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(75,143,214,.5);}100%{box-shadow:0 0 0 22px rgba(75,143,214,0);}}

.tabs-row{display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto;}
.tab-btn{padding:10px 6px; background:none; border:none; color:var(--muted); font-weight:600; font-size:13.5px; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--brand); border-color:var(--brand);}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table th{text-align:left; color:var(--muted); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--line); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
table.data-table td{padding:9px 6px; border-bottom:1px solid var(--line);}
table.data-table tr:last-child td{border-bottom:none;}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px;}
.kpi{padding:14px; }
.kpi .num{font-family:var(--font-head); font-size:22px;}
.kpi .lbl{color:var(--muted); font-size:11.5px; margin-top:2px;}

/* ============================================================
   DASHBOARDS (pantalla completa)
   ============================================================ */
.dash-wrap{height:100%; display:flex; flex-direction:column;}
.dash-body{flex:1; overflow-y:auto; padding:20px 26px;}
.dash-section{max-width:980px; margin:0 auto;}
.row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

/* ============================================================
   TICKET IMPRESIÓN 58mm
   ============================================================ */
#ticket-imprimir{display:none;}
@media print{
  body *{visibility:hidden;}
  #ticket-imprimir, #ticket-imprimir *{visibility:visible;}
  #ticket-imprimir{
    display:block !important; position:absolute; left:0; top:0; width:58mm;
    font-family:'Courier New', monospace; color:#000; font-size:11px; padding:2mm;
  }
  #ticket-imprimir .t-center{text-align:center;}
  #ticket-imprimir hr{border:none; border-top:1px dashed #000; margin:4px 0;}
  #ticket-imprimir .t-row{display:flex; justify-content:space-between;}
  #ticket-imprimir h2{font-size:13px; margin:0 0 2px;}
}
@media screen{ #ticket-imprimir{display:none !important;} }

/* ============================================================
   PROPINA / IMPUESTOS
   ============================================================ */
.propina-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.propina-row .btn{flex:1; min-width:64px;}
.impuesto-line{display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px; color:var(--muted);}

/* ============================================================
   BARRA DE ACCIONES CENTRADA (mesa / modales)
   ============================================================ */
.actions-bar{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:stretch;
  margin-top:16px;
}
.actions-bar .btn{flex:1 1 130px; max-width:220px; padding:13px 14px;}

/* Responsive */
@media (max-width:640px){
  .modal{width:100%;}
  .form-grid{grid-template-columns:1fr;}
  .mesero-grid{grid-template-columns:1fr 1fr;}
  .topbar{flex-direction:column; align-items:stretch; gap:8px;}
  .topbar-actions{justify-content:center; flex-wrap:wrap;}
  .dash-body{padding:14px 12px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .tabs-row{justify-content:flex-start;}
  .fab{left:50%; right:auto; transform:translateX(-50%); bottom:18px; width:calc(100% - 32px); max-width:320px;}
  .fab .btn{width:100%;}
  .actions-bar .btn{flex:1 1 100%; max-width:none;}
  .sillas-grid{grid-template-columns:repeat(auto-fill, minmax(78px,1fr));}
  .login-card{padding:26px 20px;}
  .modal{padding:18px 16px 20px;}
}
@media (max-width:400px){
  .kpi-row{grid-template-columns:1fr;}
  .propina-row .btn{min-width:56px; font-size:12.5px;}
}
</style>
</head>

</div>

<!-- =========================================================

<div id="screen-admin" class="hidden dash-wrap">

        <button class="tab-btn" data-tab="config">Configuración</button>
      </div>
      <div id="tabContent"></div>
    </div>
  </div>
</div>

<!-- =========================================================
     ADMIN GENERAL (SUPERADMIN — ve todos los restaurantes)
     ========================================================= -->
<div id="screen-superadmin" class="hidden dash-wrap">
  <div class="topbar">
    <div><div class="rest-name">Admin general</div><div class="who">Todos los restaurantes</div></div>
    <div class="topbar-actions">
      <button class="btn btn-sm btn-ghost" id="btnSalirSuperAdmin">Salir</button>
    </div>

  <div class="dash-body">

        <button class="tab-btn" data-stab="restaurantes">Restaurantes</button>
      </div>
      <div id="superTabContent"></div>
    </div>
  </div>
</div>

<!-- =========================================================
     DASHBOARD MESERO (mis mesas)
     ========================================================= -->
<div id="screen-mesero-dash" class="hidden dash-wrap">
  <div class="topbar">
    <div><div class="rest-name">Mis mesas</div><div class="who" id="meseroDashWho">—</div></div>

      </div>
      <div id="meseroDashContent"></div>
    </div>
  </div>
</div>

function toast(msg, tipo='ok'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + tipo;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}
function money(n){

async function iniciar(){
  const { data: rests, error } = await supa.from('restaurantes').select('*').order('nombre');
  if(error){ toast('No se pudo conectar a Supabase. Revisa SUPABASE_URL / ANON_KEY.', 'err'); console.error(error); return; }
  state.restaurantes = rests || [];

  const host = window.location.hostname;
  const partes = host.split('.');
  let slug = null;
  if(partes.length > 2 && partes[0] !== 'www') slug = partes[0];

  let rest = state.restaurantes.find(r => r.subdominio === slug);

  const selWrap = document.getElementById('restSelectorWrap');
  const sel = document.getElementById('restSelector');
  sel.innerHTML = state.restaurantes.map(r=>`<option value="${r.id}">${r.nombre}</option>`).join('');

    rest = state.restaurantes[0];

      document.getElementById('loginRestName').textContent = state.restaurante ? state.restaurante.nombre : 'Plaza Cashless';
    });
  }
  state.restaurante = rest || null;
  document.getElementById('loginRestName').textContent = rest ? rest.nombre : 'No hay restaurantes configurados';

  // cargar config admin
  const { data: cfg } = await supa.from('config_admin').select('*').eq('id',1).single();
  if(cfg){
    state.adminPassword = cfg.password;
    if(cfg.superadmin_password) state.superadminPassword = cfg.superadmin_password;
  }
}

   IMPUESTOS Y TOTALES (subtotal + impuestos + propina opcional)
   ============================================================= */
async function cargarImpuestos(){
  if(!state.restaurante) { state.impuestos = []; return; }
  const { data } = await supa.from('impuestos').select('*').eq('restaurante_id', state.restaurante.id).eq('activo', true).order('nombre');
  state.impuestos = data || [];
}
function calcularTotales(subtotal, propinaPct=0){
  subtotal = Number(subtotal)||0;
  const lineasImpuestos = state.impuestos.map(imp=>({
    nombre: imp.nombre,
    porcentaje: Number(imp.porcentaje),
    valor: subtotal * (Number(imp.porcentaje)/100)
  }));
  const totalImpuestos = lineasImpuestos.reduce((s,l)=>s+l.valor,0);
  const propina = (subtotal + totalImpuestos) * (Number(propinaPct||0)/100);
  const total = subtotal + totalImpuestos + propina;
  return { subtotal, lineasImpuestos, totalImpuestos, propinaPct:Number(propinaPct||0), propina, total };
}

async function cargarProductos(){
  const { data } = await supa.from('productos').select('*').eq('restaurante_id', state.restaurante.id).eq('activo', true).order('categoria');
  state.productos = data || [];
  await cargarImpuestos();
}
async function cargarMesas(){
  const { data: mesas } = await supa.from('mesas').select('*').eq('restaurante_id', state.restaurante.id);
  state.mesas = mesas || [];
  for(const m of state.mesas){
    const { data: sillas } = await supa.from('sillas').select('*').eq('mesa_id', m.id).order('angulo');
    state.sillasPorMesa[m.id] = sillas || [];
    const { data: clientes } = await supa.from('clientes').select('*').eq('mesa_id', m.id);
    state.clientesPorMesa[m.id] = clientes || [];
    const { data: items } = await supa.from('pedidos_items').select('*').eq('mesa_id', m.id);
    state.pedidosPorMesa[m.id] = items || [];
  }
  renderMesas3D();
}
async function recargarMesa(mesaId){
  const { data: m } = await supa.from('mesas').select('*').eq('id', mesaId).single();
  if(m){
    const idx = state.mesas.findIndex(x=>x.id===mesaId);
    if(idx>=0) state.mesas[idx] = m; else state.mesas.push(m);
  }
  const { data: sillas } = await supa.from('sillas').select('*').eq('mesa_id', mesaId).order('angulo');
  state.sillasPorMesa[mesaId] = sillas || [];
  const { data: clientes } = await supa.from('clientes').select('*').eq('mesa_id', mesaId);
  state.clientesPorMesa[mesaId] = clientes || [];
  const { data: items } = await supa.from('pedidos_items').select('*').eq('mesa_id', mesaId);
  state.pedidosPorMesa[mesaId] = items || [];
  actualizarMesh(mesaId);
}
function suscribirRealtime(){
  // Si ya hay un canal activo (por ejemplo, se entró y salió del mapa varias
  // veces, o el mesero y el admin lo abrieron en la misma sesión), no crear
  // otro: evita duplicar los eventos y refrescos del mapa.
  if(state.canalRealtime) return;
  state.canalRealtime = supa.channel('plaza-cambios')
    .on('postgres_changes', {event:'*', schema:'public', table:'mesas'}, payload=>{
      if(payload.new && payload.new.restaurante_id !== state.restaurante.id) return;
      recargarMesa(payload.new ? payload.new.id : payload.old.id);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'sillas'}, payload=>{
      const mid = (payload.new||payload.old||{}).mesa_id;
      if(mid) recargarMesa(mid);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'clientes'}, payload=>{
      const mid = (payload.new||payload.old||{}).mesa_id;
      if(mid) recargarMesa(mid);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'pedidos_items'}, payload=>{
      const mid = (payload.new||payload.old||{}).mesa_id;
      if(mid) recargarMesa(mid);
    })
    .subscribe();
}

/* =============================================================
   MOTOR 3D (Three.js)
   ============================================================= */
let scene, camera, renderer, controls, raycaster, mouse, groundPlane, threeInicializado=false;

function initThree(){
  threeInicializado = true;
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('three-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x11151b);
  scene.fog = new THREE.Fog(0x11151b, 30, 70);

  camera = new THREE.PerspectiveCamera(50, wrap.clientWidth/wrap.clientHeight, 0.1, 200);
  camera.position.set(0, 18, 20);

  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.maxPolarAngle = Math.PI/2.05;
  controls.minDistance = 6; controls.maxDistance = 45;
  controls.target.set(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(10,20,10);
  scene.add(dir);

  const floorGeo = new THREE.PlaneGeometry(80,80);
  const floorMat = new THREE.MeshStandardMaterial({color:0x1a2029});
  groundPlane = new THREE.Mesh(floorGeo, floorMat);
  groundPlane.rotation.x = -Math.PI/2;
  groundPlane.userData = {type:'suelo'};
  scene.add(groundPlane);

  const grid = new THREE.GridHelper(80, 40, 0x2a3340, 0x232b36);
  scene.add(grid);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  renderMesas3D();
  animate();
}
function onResize(){
  const wrap = document.getElementById('canvas-wrap');
  camera.aspect = wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
}
function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); }

function colorEstado(estado){ return estado === 'ocupada' ? 0xd64545 : 0x3fae5b; }

function construirMeshMesa(mesa){
  const grupo = new THREE.Group();
  grupo.position.set(mesa.pos_x, 0, mesa.pos_z);
  grupo.userData = {type:'mesa', mesaId:mesa.id};

  const topGeo = new THREE.CylinderGeometry(1.3, 1.3, 0.18, 24);
  const topMat = new THREE.MeshStandardMaterial({color: colorEstado(mesa.estado)});
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = 0.75;
  top.userData = {type:'mesaBase', mesaId:mesa.id};
  grupo.add(top);

  const poleGeo = new THREE.CylinderGeometry(0.12,0.16,0.75,10);
  const pole = new THREE.Mesh(poleGeo, new THREE.MeshStandardMaterial({color:0x3a4250}));
  pole.position.y = 0.375;
  pole.userData = {type:'mesaBase', mesaId:mesa.id};
  grupo.add(pole);

  // etiqueta de texto simple usando sprite canvas
  grupo.add(crearEtiqueta(mesa.nombre));

  scene.add(grupo);
  state.meshesPorMesa[mesa.id] = grupo;
  actualizarSillas3D(mesa.id);
  return grupo;
}
function crearEtiqueta(texto){
  const cnv = document.createElement('canvas'); cnv.width=256; cnv.height=64;
  const ctx = cnv.getContext('2d');
  ctx.fillStyle='rgba(17,21,27,.85)'; ctx.roundRect ? ctx.roundRect(0,10,256,44,10) : ctx.fillRect(0,10,256,44);
  ctx.fill();
  ctx.font='bold 30px Arial'; ctx.fillStyle='#eceef1'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(texto, 128, 33);
  const tex = new THREE.CanvasTexture(cnv);
  const mat = new THREE.SpriteMaterial({map:tex, depthTest:false});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(2.4,0.6,1);
  spr.position.set(0, 2.1, 0);
  spr.userData = {type:'etiqueta'};
  return spr;
}
function actualizarSillas3D(mesaId){
  const grupo = state.meshesPorMesa[mesaId];
  if(!grupo) return;
  [...grupo.children].forEach(c=>{ if(c.userData.type==='silla') grupo.remove(c); });
  const sillas = state.sillasPorMesa[mesaId] || [];
  const radio = 2.1;
  sillas.forEach(s=>{
    const rad = THREE.MathUtils.degToRad(s.angulo);
    const geo = new THREE.BoxGeometry(0.55,0.55,0.55);
    const ocupada = !!s.cliente_id;
    const mat = new THREE.MeshStandardMaterial({color: ocupada ? 0xd9a441 : 0x3a4250});
    const box = new THREE.Mesh(geo, mat);
    box.position.set(Math.sin(rad)*radio, 0.3, Math.cos(rad)*radio);
    box.userData = {type:'silla', mesaId, sillaId:s.id};
    grupo.add(box);
  });
}
function actualizarMesh(mesaId){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  if(!mesa) return;
  let grupo = state.meshesPorMesa[mesaId];
  if(!grupo){ construirMeshMesa(mesa); return; }
  grupo.position.set(mesa.pos_x, 0, mesa.pos_z);
  const base = grupo.children.find(c=>c.userData.type==='mesaBase' && c.geometry.type==='CylinderGeometry' && c.geometry.parameters.radiusTop===1.3);
  if(base) base.material.color.setHex(colorEstado(mesa.estado));
  actualizarSillas3D(mesaId);
  if(state.mesaSeleccionadaId === mesaId) refrescarModalMesaSiAbierto(mesaId);
}
function renderMesas3D(){
  if(!scene) return;
  const idsActuales = new Set(state.mesas.map(m=>m.id));
  Object.keys(state.meshesPorMesa).forEach(id=>{
    if(!idsActuales.has(id)){ scene.remove(state.meshesPorMesa[id]); delete state.meshesPorMesa[id]; }
  });
  state.mesas.forEach(m=>{
    if(!state.meshesPorMesa[m.id]) construirMeshMesa(m);
    else actualizarMesh(m.id);
  });
}

/* -------- interacción: click / arrastre -------- */
let arrastrando = false;
function coordsMouse(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
}
function raycastSuelo(){
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObject(groundPlane)[0];
  return hit ? hit.point : null;
}
function raycastObjetos(){
  raycaster.setFromCamera(mouse, camera);
  const objetos = [];
  Object.values(state.meshesPorMesa).forEach(g=>g.children.forEach(c=>{ if(c.userData.type==='mesaBase'||c.userData.type==='silla') objetos.push(c); }));
  return raycaster.intersectObjects(objetos)[0];
}

function onPointerDown(e){
  coordsMouse(e);
  if(state.modo === 'colocando'){
    const p = raycastSuelo();
    if(p){ crearMesaEnPosicion(p.x, p.z); }
    return;
  }
  if(state.modo === 'moviendo'){
    arrastrando = true;
    controls.enabled = false;
    moverMesaAlPuntero();
    return;
  }
  const hit = raycastObjetos();
  if(hit){
    const ud = hit.object.userData;
    if(ud.type === 'mesaBase') abrirMesa(ud.mesaId);
    if(ud.type === 'silla') abrirSilla(ud.mesaId, ud.sillaId);
  }
}
function onPointerMove(e){
  if(state.modo==='moviendo' && arrastrando){ coordsMouse(e); moverMesaAlPuntero(); }
}
function onPointerUp(){
  if(state.modo==='moviendo'){ arrastrando=false; controls.enabled = true; }
}
function moverMesaAlPuntero(){
  const p = raycastSuelo();
  if(!p) return;
  const grupo = state.meshesPorMesa[state.moviendoMesaId];
  if(grupo) grupo.position.set(p.x, 0, p.z);
}

function cancelarModo(){

async function confirmarModoMover(){

async function crearMesaEnPosicion(x,z){
  const nombre = state.colocandoNombrePendiente;
  state.modo = null; state.colocandoNombrePendiente=null; hide('modeBanner');
  const { data, error } = await supa.from('mesas').insert({
    restaurante_id: state.restaurante.id, nombre, pos_x:x, pos_z:z, estado:'libre'
  }).select().single();
  if(error){ toast('No se pudo crear la mesa','err'); console.error(error); return; }

/*
  NOTA SOBRE LA LECTURA NFC EN SAMSUNG (S24 Ultra) VS OPPO:
  ----------------------------------------------------------------
  El código anterior tenía dos bugs reales:

  1) `reader.onreading = ...` se asignaba DESPUÉS de `await reader.scan()`.
     En algunos navegadores/dispositivos (incluyendo builds de Chrome en
     ciertos Samsung) la primera lectura puede llegar muy rápido, casi
     al mismo tiempo que se resuelve `scan()`, así que el listener a
     veces no alcanzaba a registrarse a tiempo. Ahora el listener se
     registra ANTES de iniciar el escaneo.

  2) `ev.serialNumber || ('NFC-'+Date.now())`. Web NFC (NDEFReader) NO
     siempre expone el UID físico del tag: `serialNumber` puede llegar
     vacío según el navegador/dispositivo, y eso es normal en la
     especificación (no es "no soportado", simplemente no todos los
     stacks Android/Chrome lo entregan igual). El bug real está en el
     fallback: al generar un código con Date.now() cada vez que el
     serial viene vacío, CADA lectura de la MISMA pulsera genera un
     código DIFERENTE. Por eso "funciona" (no truena) pero nunca
     reconoce una pulsera ya registrada en ese teléfono: el código
     nunca es estable.
     Ahora, si el serial viene vacío, se intenta derivar un código
     ESTABLE a partir del contenido NDEF grabado en el tag (si tiene
     algún registro). Si el tag no tiene NDEF y el navegador no da
     serial, se avisa claramente al usuario en vez de inventar un
     código falso, y se ofrece el ingreso manual.

  Importante (límite real de Web NFC, como bien lo detectaste): la API
  web NO da acceso al UID de bajo nivel del chip (Tag.getId() de
  Android). Si tus pulseras necesitan sí o sí el UID físico, la única
  vía 100% confiable es una app/companion Android nativa que lea
  Tag.getId() y se lo pase a esta página (por ejemplo vía un intent,
  un WebView con puente JS, o escribiendo el UID como texto en el
  propio tag NDEF). Mientras tanto, este fix hace que el comportamiento
  sea consistente y predecible en Chrome/Android con Web NFC.
*/
async function iniciarEscaneoNFC(onCodigo){
  const pulse = document.getElementById('nfcPulse');
  const texto = document.getElementById('nfcTexto');
  if(!('NDEFReader' in window)){
    texto.textContent = 'Web NFC no disponible en este navegador. Usa Chrome en Android (HTTPS) o escribe el código manualmente.';
    return;
  }
  // cancela cualquier escaneo anterior antes de iniciar uno nuevo
  if(abortNFC){ abortNFC.abort(); abortNFC = null; }
  const controller = new AbortController();
  abortNFC = controller;

  pulse.classList.add('scanning');
  texto.textContent = 'Acerca la pulsera al lector NFC…';

  try{
    const reader = new NDEFReader();

    // 1) el listener se registra ANTES de llamar a scan()
    reader.onreading = (ev)=>{
      let codigo = ev.serialNumber || '';
      if(!codigo){
        // intenta derivar un código estable a partir del contenido NDEF del tag
        codigo = derivarCodigoDesdeNDEF(ev.message);
      }
      pulse.classList.remove('scanning');
      if(!codigo){
        texto.textContent = 'Este dispositivo/navegador no entregó un identificador estable para esta pulsera. Escríbelo manualmente para poder reconocerla en próximas lecturas.';
        toast('No se obtuvo un código NFC estable. Usa el ingreso manual.', 'err');
        return;
      }
      mostrarLecturaExitosa(codigo);
      onCodigo(codigo);
    };
    reader.onreadingerror = ()=>{
      texto.textContent = 'No se pudo leer la pulsera. Vuelve a intentarlo, acercándola más tiempo al lector.';
      pulse.classList.remove('scanning');
    };

    // 2) inicia el escaneo con AbortController para poder cancelarlo
    await reader.scan({ signal: controller.signal });
  } catch(err){
    pulse.classList.remove('scanning');
    if(err && err.name === 'AbortError') return; // escaneo cancelado a propósito, no es un error real
    if(err && err.name === 'NotAllowedError'){
      texto.textContent = 'Permiso NFC denegado. Actívalo en los permisos del sitio (Chrome ⋮ → Información del sitio → Permisos → NFC).';
    } else if(err && err.name === 'NotSupportedError'){
      texto.textContent = 'Este dispositivo/navegador no soporta Web NFC. En Android usa Chrome (no Samsung Internet) sobre HTTPS.';
    } else {
      texto.textContent = 'No se pudo iniciar el escaneo NFC: ' + (err && err.message ? err.message : 'error desconocido');
    }
  }
}

// Deriva un código determinístico (mismo tag = mismo código siempre) a partir
// de los registros NDEF grabados en la pulsera, para usarlo cuando el
// navegador no entrega serialNumber.
function derivarCodigoDesdeNDEF(message){
  try{
    if(!message || !message.records || !message.records.length) return '';
    const decoder = new TextDecoder();
    const partes = message.records.map(r=>{
      if(r.data){
        try{ return decoder.decode(r.data); }catch(e){ return Array.from(new Uint8Array(r.data.buffer||r.data)).join(','); }
      }
      return r.recordType || '';
    });
    const raw = partes.join('|');
    if(!raw) return '';
    // hash corto y estable (no criptográfico, solo para generar un ID reproducible)
    let hash = 0;
    for(let i=0;i<raw.length;i++){ hash = ((hash<<5)-hash) + raw.charCodeAt(i); hash |= 0; }
    return 'NDEF-' + Math.abs(hash).toString(16).toUpperCase();
  } catch(e){
    return '';
  }
}

/* =============================================================
   LECTOR USB DE ESCRITORIO (ACR122U) VÍA BRIDGE LOCAL (WebSocket)
   ----------------------------------------------------------------
   El navegador no puede hablar PC/SC directamente con el ACR122U.
   Se necesita un pequeño programa corriendo en el computador donde
   está conectado el lector (el "bridge"), que sí hable PC/SC de un
   lado y exponga un WebSocket local del otro. Esta página se conecta
   a ese WebSocket para recibir el UID de cada tag leído.
   El bridge (Node.js) se entrega aparte — ver README del bridge.
   ============================================================= */
let wsUSB = null;
const NFC_BRIDGE_URL_DEFAULT = 'ws://127.0.0.1:4000';
function iniciarEscaneoUSB(onCodigo){
  const pulse = document.getElementById('nfcPulse');
  const texto = document.getElementById('nfcTexto');
  const url = window.NFC_BRIDGE_URL || NFC_BRIDGE_URL_DEFAULT;
  if(pulse) pulse.classList.add('scanning');
  if(texto) texto.textContent = 'Conectando al lector USB (' + url + ')…';
  try{
    if(wsUSB){ try{ wsUSB.close(); }catch(e){} wsUSB = null; }
    const ws = new WebSocket(url);
    wsUSB = ws;
    ws.onopen = ()=>{ if(texto) texto.textContent = 'Lector USB conectado. Acerca la pulsera al ACR122U…'; };
    ws.onmessage = (ev)=>{
      let data;
      try{ data = JSON.parse(ev.data); } catch(e){ return; }
      if(data && data.type === 'nfc-uid' && data.uid){
        if(pulse) pulse.classList.remove('scanning');
        mostrarLecturaExitosa(data.uid);
        onCodigo(data.uid);
      } else if(data && data.type === 'nfc-error'){
        if(texto) texto.textContent = 'Error del lector USB: ' + data.message;
      }
    };
    ws.onerror = ()=>{
      if(texto) texto.textContent = 'No se pudo conectar al bridge del lector USB. ¿Está corriendo el programa "bridge-acr122u" en este computador?';
      if(pulse) pulse.classList.remove('scanning');
    };
    ws.onclose = ()=>{ if(pulse) pulse.classList.remove('scanning'); };
  } catch(err){
    if(texto) texto.textContent = 'Error conectando al lector USB: ' + err.message;
    if(pulse) pulse.classList.remove('scanning');
  }
}
function detenerEscaneoUSB(){
  if(wsUSB){ try{ wsUSB.close(); }catch(e){} wsUSB = null; }
}
function mostrarLecturaExitosa(codigo){
  const box = document.getElementById('nfcBox');
  if(!box) return;
  box.innerHTML = `

    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${codigo}</div>
  `;
}

    } else {
      zone.innerHTML = `<div class="check-anim pop" style="margin-top:10px"><svg viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></svg></div><div style="text-align:center;margin-top:6px;font-weight:700;color:var(--libre)">Cargando a: ${cliente.nombre}</div>`;
      overlay.querySelector('#pedidoFormZone').classList.remove('hidden');
    }
  }
  function pintarSelectProductos(){
    const sel = overlay.querySelector('#prodSelect');
    if(!sel) return;
    const porCategoria = {};
    state.productos.forEach(p=>{ (porCategoria[p.categoria]=porCategoria[p.categoria]||[]).push(p); });
    sel.innerHTML = Object.entries(porCategoria).map(([cat,ps])=>
      `<optgroup label="${cat}">${ps.map(p=>`<option value="${p.id}" data-precio="${p.precio}">${p.nombre} — ${money(p.precio)}</option>`).join('')}</optgroup>`
    ).join('');
    actualizarPrecioLbl();

  }
  function actualizarPrecioLbl(){
    const sel = overlay.querySelector('#prodSelect');
    const lbl = overlay.querySelector('#precioUnitLbl');
    if(!sel || !sel.selectedOptions[0]) return;
    lbl.textContent = money(sel.selectedOptions[0].getAttribute('data-precio'));
  }
  function pintarListaItems(){
    const zone = overlay.querySelector('#listaItemsCliente');
    if(!clienteActivo){ zone.innerHTML = '<p style="color:var(--muted);font-size:13px">Selecciona un cliente para ver su pedido.</p>'; return; }
    const items = (state.pedidosPorMesa[mesaId]||[]).filter(i=>i.cliente_id===clienteActivo);
    zone.innerHTML = items.map(i=>`<div class="linea-item"><span>${i.producto_nombre} <span class="qty">x${i.cantidad}</span></span><span>${money(i.precio_unitario*i.cantidad)}</span></div>`).join('') || '<p style="color:var(--muted);font-size:13px">Sin productos aún.</p>';
    zone.insertAdjacentHTML('beforeend', `<div class="total-row"><span>Total</span><span>${money(totalesCliente(mesaId, clienteActivo))}</span></div>`);
  }
  function pintarTodo(){ pintarSelectorCuentas(); pintarZonaScan(); pintarSelectProductos(); pintarListaItems(); }

  overlay.querySelector('#btnVerInventarioPedido').addEventListener('click', abrirInventario);
  pintarTodo();

  overlay.addEventListener('click', async (e)=>{
    if(e.target && e.target.id === 'btnAgregarItem'){
      const sel = overlay.querySelector('#prodSelect');
      const opt = sel.selectedOptions[0];
      const cant = parseInt(overlay.querySelector('#cantInput').value)||1;
      if(!opt) return;
      await supa.from('pedidos_items').insert({
        mesa_id:mesaId, cliente_id:clienteActivo, producto_id:opt.value,
        producto_nombre: opt.textContent.split(' — ')[0], precio_unitario: opt.getAttribute('data-precio'),
        cantidad: cant, mesero_id: state.mesero ? state.mesero.id : null
      });
      await recargarMesa(mesaId);
      pintarListaItems();
      const zone = overlay.querySelector('#pedidoScanZone');
      const check = document.createElement('div');
      check.className='check-anim pop'; check.style.marginTop='8px';
      check.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></svg>';
      zone.appendChild(check);
      setTimeout(()=>check.remove(), 900);
      toast('Producto agregado');
    }
  });
}

window.abrirVerCuenta = function(mesaId){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  const clientes = state.clientesPorMesa[mesaId]||[];
  let bloque = '';
  if(mesa.cuentas_separadas){
    bloque = clientes.map(c=>{
      const items = (state.pedidosPorMesa[mesaId]||[]).filter(i=>i.cliente_id===c.id);
      const t = calcularTotales(totalesCliente(mesaId,c.id));
      return `<h4 style="margin-top:14px">${c.nombre}</h4>` +
        items.map(i=>`<div class="linea-item"><span>${i.producto_nombre} <span class="qty">x${i.cantidad}</span></span><span>${money(i.precio_unitario*i.cantidad)}</span></div>`).join('') +
        t.lineasImpuestos.map(l=>`<div class="impuesto-line"><span>${l.nombre} (${l.porcentaje}%)</span><span>${money(l.valor)}</span></div>`).join('') +
        `<div class="total-row"><span>Subtotal + impuestos</span><span>${money(t.total)}</span></div>`;
    }).join('');
  } else {
    const items = state.pedidosPorMesa[mesaId]||[];
    bloque = items.map(i=>`<div class="linea-item"><span>${i.producto_nombre} <span class="qty">x${i.cantidad}</span></span><span>${money(i.precio_unitario*i.cantidad)}</span></div>`).join('');
  }
  const tMesa = calcularTotales(totalMesa(mesaId));
  abrirModal(`
    <div class="modal-head"><h3>Cuenta — ${mesa.nombre}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    ${bloque || '<p style="color:var(--muted)">Sin productos registrados.</p>'}
    ${!mesa.cuentas_separadas ? tMesa.lineasImpuestos.map(l=>`<div class="impuesto-line"><span>${l.nombre} (${l.porcentaje}%)</span><span>${money(l.valor)}</span></div>`).join('') : ''}
    <div class="total-row"><span>Total mesa (con impuestos)</span><span>${money(tMesa.total)}</span></div>
  `, {wide:true});
}

window.abrirCerrarMesa = function(mesaId){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  const clientes = state.clientesPorMesa[mesaId]||[];
  const cuentas = mesa.cuentas_separadas ? clientes : [{id:'__total__', nombre:'Cuenta única'}];
  let propinaPct = 0;
  const overlay = abrirModal(`
    <div class="modal-head"><h3>Cerrar mesa — ${mesa.nombre}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <p class="modal-sub">Imprime cada cuenta y luego confirma la liquidación.</p>
    <div id="cuentasParaCerrar"></div>
    <label class="field">Propina (opcional)</label>
    <div class="propina-row" id="propinaRow">
      <button class="btn btn-brand" data-prop="0">Sin propina</button>
      <button class="btn" data-prop="10">10%</button>
      <button class="btn" data-prop="15">15%</button>
    </div>
    <button class="btn btn-danger btn-block" style="margin-top:16px" id="btnConfirmarLiquidar">Confirmar liquidación y liberar mesa</button>
  `, {wide:true});
  const zone = overlay.querySelector('#cuentasParaCerrar');
  function pintarCuentas(){
    zone.innerHTML = cuentas.map(c=>{
      const subtotal = c.id==='__total__' ? totalMesa(mesaId) : totalesCliente(mesaId, c.id);
      const t = calcularTotales(subtotal, propinaPct);
      return `<div class="linea-item"><span>${c.nombre}</span><span style="display:flex;gap:10px;align-items:center">${money(t.total)} <button class="btn btn-sm" data-imprimir="${c.id}">🖨️ Imprimir</button></span></div>`;
    }).join('');
    zone.querySelectorAll('[data-imprimir]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cid = btn.getAttribute('data-imprimir');
        const cuenta = cid==='__total__' ? {id:'__total__', nombre:'Cuenta única'} : clientes.find(c=>c.id===cid);
        const subtotal = cid==='__total__' ? totalMesa(mesaId) : totalesCliente(mesaId, cid);
        imprimirTicket(mesa, cuenta, mesaId, calcularTotales(subtotal, propinaPct));
      });
    });
  }
  overlay.querySelectorAll('#propinaRow [data-prop]').forEach(b=> b.addEventListener('click', function(){
    overlay.querySelectorAll('#propinaRow [data-prop]').forEach(x=>x.classList.remove('btn-brand'));
    this.classList.add('btn-brand');
    propinaPct = Number(this.getAttribute('data-prop'));
    pintarCuentas();
  }));
  pintarCuentas();
  overlay.querySelector('#btnConfirmarLiquidar').addEventListener('click', ()=> liquidarMesa(mesaId, overlay, ()=>propinaPct));
}

function imprimirTicket(mesa, cuenta, mesaId, totales){
  const items = cuenta.id==='__total__' ? (state.pedidosPorMesa[mesaId]||[]) : (state.pedidosPorMesa[mesaId]||[]).filter(i=>i.cliente_id===cuenta.id);
  const subtotal = items.reduce((s,i)=> s+Number(i.precio_unitario)*i.cantidad, 0);
  const t = totales || calcularTotales(subtotal);
  const fecha = new Date().toLocaleString('es-CO');
  const div = document.getElementById('ticket-imprimir');
  div.innerHTML = `
    <div class="t-center"><h2>${state.restaurante.nombre}</h2></div>
    <div class="t-center">${mesa.nombre} · ${cuenta.nombre}</div>
    <div class="t-center">${fecha}</div>
    <hr>
    ${items.map(i=>`<div class="t-row"><span>${i.cantidad}x ${i.producto_nombre}</span><span>${money(i.precio_unitario*i.cantidad)}</span></div>`).join('')}
    <hr>
    <div class="t-row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
    ${t.lineasImpuestos.map(l=>`<div class="t-row"><span>${l.nombre} (${l.porcentaje}%)</span><span>${money(l.valor)}</span></div>`).join('')}
    ${t.propinaPct>0 ? `<div class="t-row"><span>Propina (${t.propinaPct}%)</span><span>${money(t.propina)}</span></div>` : ''}
    <hr>
    <div class="t-row" style="font-weight:bold"><span>TOTAL A PAGAR</span><span>${money(t.total)}</span></div>
    <div class="t-center" style="margin-top:6px">¡Gracias por su visita!</div>
  `;
  window.print();
}

async function liquidarMesa(mesaId, overlay, getPropinaPct){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  const clientes = state.clientesPorMesa[mesaId]||[];
  const items = state.pedidosPorMesa[mesaId]||[];
  const propinaPct = getPropinaPct ? getPropinaPct() : 0;
  const subtotal = totalMesa(mesaId);
  const t = calcularTotales(subtotal, propinaPct);
  const cuentasJson = mesa.cuentas_separadas
    ? clientes.map(c=>({cliente:c.nombre, total:calcularTotales(totalesCliente(mesaId,c.id), propinaPct).total, items: items.filter(i=>i.cliente_id===c.id)}))
    : [{cliente:'Cuenta única', total:t.total, items}];

  await supa.from('mesas_liquidadas').insert({
    mesa_nombre: mesa.nombre, restaurante_id: state.restaurante.id, mesero_id: mesa.mesero_id,
    total: t.total, subtotal: t.subtotal, impuestos: t.totalImpuestos, propina: t.propina, cuentas: cuentasJson
  });
  // limpiar mesa
  await supa.from('pedidos_items').delete().eq('mesa_id', mesaId);
  const sillaIds = (state.sillasPorMesa[mesaId]||[]).map(s=>s.id);
  await supa.from('sillas').delete().eq('mesa_id', mesaId);
  await supa.from('clientes').delete().eq('mesa_id', mesaId);
  await supa.from('mesas').update({estado:'libre', num_clientes:0, cuentas_separadas:false, mesero_id:null}).eq('id', mesaId);

  await recargarMesa(mesaId);
  cerrarModal(overlay);
  toast('Mesa liquidada y liberada');
}

   LIQUIDAR UN SOLO CLIENTE (se retira de la mesa sin cerrarla)
   ============================================================= */
window.abrirLiquidarCliente = function(mesaId, clienteId){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  const cliente = (state.clientesPorMesa[mesaId]||[]).find(c=>c.id===clienteId);
  if(!mesa || !cliente) return;
  let propinaPct = 0;
  const subtotal = totalesCliente(mesaId, clienteId);
  const overlay = abrirModal(`
    <div class="modal-head"><h3>Liquidar a ${cliente.nombre}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <p class="modal-sub">Cobra su consumo y libéralo de la mesa. El resto de la mesa sigue activa.</p>
    <div id="liqClienteDetalle"></div>
    <label class="field">Propina (opcional)</label>
    <div class="propina-row" id="propinaRowCliente">
      <button class="btn btn-brand" data-prop="0">Sin propina</button>
      <button class="btn" data-prop="10">10%</button>
      <button class="btn" data-prop="15">15%</button>
    </div>
    <div class="actions-bar">
      <button class="btn" id="btnImprimirCliente">🖨️ Imprimir valor a pagar</button>
      <button class="btn btn-danger" id="btnConfirmarLiquidarCliente">Confirmar y retirar</button>
    </div>
  `, {wide:true});
  function pintarDetalle(){
    const items = (state.pedidosPorMesa[mesaId]||[]).filter(i=>i.cliente_id===clienteId);
    const t = calcularTotales(subtotal, propinaPct);
    overlay.querySelector('#liqClienteDetalle').innerHTML = `
      ${items.map(i=>`<div class="linea-item"><span>${i.producto_nombre} <span class="qty">x${i.cantidad}</span></span><span>${money(i.precio_unitario*i.cantidad)}</span></div>`).join('') || '<p style="color:var(--muted);font-size:13px">Sin productos registrados.</p>'}
      <div class="impuesto-line"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
      ${t.lineasImpuestos.map(l=>`<div class="impuesto-line"><span>${l.nombre} (${l.porcentaje}%)</span><span>${money(l.valor)}</span></div>`).join('')}
      ${t.propinaPct>0 ? `<div class="impuesto-line"><span>Propina (${t.propinaPct}%)</span><span>${money(t.propina)}</span></div>` : ''}
      <div class="total-row"><span>Total a pagar</span><span>${money(t.total)}</span></div>
    `;
  }
  overlay.querySelectorAll('#propinaRowCliente [data-prop]').forEach(b=> b.addEventListener('click', function(){
    overlay.querySelectorAll('#propinaRowCliente [data-prop]').forEach(x=>x.classList.remove('btn-brand'));
    this.classList.add('btn-brand');
    propinaPct = Number(this.getAttribute('data-prop'));
    pintarDetalle();
  }));
  pintarDetalle();
  overlay.querySelector('#btnImprimirCliente').addEventListener('click', ()=>{
    imprimirTicket(mesa, cliente, mesaId, calcularTotales(subtotal, propinaPct));
  });
  overlay.querySelector('#btnConfirmarLiquidarCliente').addEventListener('click', async ()=>{
    await liquidarClienteIndividual(mesaId, cliente, propinaPct);
    cerrarModal(overlay);
  });
}

async function liquidarClienteIndividual(mesaId, cliente, propinaPct){
  const mesa = state.mesas.find(m=>m.id===mesaId);
  const items = (state.pedidosPorMesa[mesaId]||[]).filter(i=>i.cliente_id===cliente.id);
  const t = calcularTotales(totalesCliente(mesaId, cliente.id), propinaPct);

  await supa.from('clientes_liquidados').insert({
    mesa_nombre: mesa.nombre, restaurante_id: state.restaurante.id, mesero_id: mesa.mesero_id,
    cliente_nombre: cliente.nombre, subtotal: t.subtotal, impuestos: t.totalImpuestos, propina: t.propina, total: t.total,
    items: items
  });
  await supa.from('pedidos_items').delete().eq('cliente_id', cliente.id);
  await supa.from('sillas').update({cliente_id:null}).eq('id', cliente.silla_id);
  await supa.from('clientes').delete().eq('id', cliente.id);
  await recargarMesa(mesaId);
  refrescarModalMesaSiAbierto(mesaId);
  toast(cliente.nombre + ' liquidado y retirado de la mesa');
}

function formularioProducto(id, overlayPadre){
  const p = id ? state.productos.find(x=>x.id===id) : null;
  const overlay = abrirModal(`
    <div class="modal-head"><h3>${p?'Editar':'Nuevo'} producto</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <label class="field">Nombre</label><input class="input" id="pfNombre" value="${p?p.nombre:''}">

    <label class="field">Precio</label><input class="input" id="pfPrecio" type="number" value="${p?p.precio:0}">
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-brand" style="flex:1" id="pfGuardar">Guardar</button>
      ${p?'<button class="btn btn-danger" id="pfEliminar">Eliminar</button>':''}
    </div>
  `);
  overlay.querySelector('#pfGuardar').addEventListener('click', async ()=>{
    const payload = {
      nombre: document.getElementById('pfNombre').value.trim(),
      categoria: document.getElementById('pfCategoria').value.trim()||'General',
      precio: Number(document.getElementById('pfPrecio').value)||0,
      restaurante_id: state.restaurante.id
    };
    if(p) await supa.from('productos').update(payload).eq('id', p.id);
    else await supa.from('productos').insert(payload);
    await cargarProductos();
    cerrarModal(overlay);
    if(overlayPadre) pintarInventario(overlayPadre, true);
    toast('Producto guardado');
  });
  if(p) overlay.querySelector('#pfEliminar').addEventListener('click', async ()=>{
    await supa.from('productos').update({activo:false}).eq('id', p.id);
    await cargarProductos();
    cerrarModal(overlay);
    if(overlayPadre) pintarInventario(overlayPadre, true);
    toast('Producto eliminado');
  });
}

  const liquidadasHoy = (liquidadasTodas||[]).filter(l=> new Date(l.liquidada_en).toDateString() === hoyStr);

    const totalGeneral = (liq||[]).reduce((s,l)=>s+Number(l.total),0);
    const porMesero = {};
    (liq||[]).forEach(l=>{ const key=l.mesero_id||'—'; porMesero[key]=(porMesero[key]||0)+Number(l.total); });
    const meseros = await supa.from('meseros').select('*').eq('restaurante_id', state.restaurante.id);
    const nombreMesero = id => (meseros.data||[]).find(m=>m.id===id)?.nombre || 'Sin mesero';
    el.innerHTML = `

        <div class="card kpi"><div class="num">${money(totalGeneral)}</div><div class="lbl">Total histórico</div></div>
        <div class="card kpi"><div class="num">${(liq||[]).length}</div><div class="lbl">Mesas liquidadas</div></div>
      </div>

      <table class="data-table"><thead><tr><th>Mesero</th><th>Total</th></tr></thead><tbody>
        ${Object.entries(porMesero).map(([id,tot])=>`<tr><td>${nombreMesero(id)}</td><td>${money(tot)}</td></tr>`).join('') || '<tr><td colspan="2">Sin datos aún</td></tr>'}
      </tbody></table>
      <h4 style="margin:18px 0 8px">Últimas mesas liquidadas</h4>
      <table class="data-table"><thead><tr><th>Mesa</th><th>Mesero</th><th>Fecha</th><th>Total</th></tr></thead><tbody>
        ${(liq||[]).slice(0,20).map(l=>`<tr><td>${l.mesa_nombre}</td><td>${nombreMesero(l.mesero_id)}</td><td>${new Date(l.liquidada_en).toLocaleString('es-CO')}</td><td>${money(l.total)}</td></tr>`).join('') || '<tr><td colspan="4">Sin datos aún</td></tr>'}
      </tbody></table>
    `;
  }
  if(tab==='cruce'){
    const { data: liq } = await supa.from('mesas_liquidadas').select('*').eq('restaurante_id', state.restaurante.id).order('liquidada_en',{ascending:false});
    const { data: ms } = await supa.from('meseros').select('*').eq('restaurante_id', state.restaurante.id).order('nombre');
    state._cruceLiq = liq || [];
    state._cruceMeseros = ms || [];
    el.innerHTML = `
      <h4>Cruce: entregado por el mesero vs. facturado en la mesa</h4>
      <p class="modal-sub" style="margin-bottom:10px">Compara, mesa por mesa, los productos que el mesero registró como entregados contra lo que finalmente se facturó, para confirmar que todo lo cobrado corresponde a lo entregado.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <div style="min-width:180px"><label class="field">Mesero</label><select class="input" id="cruceMeseroSel"><option value="">Todos los meseros</option>${(ms||[]).map(m=>`<option value="${m.id}">${m.nombre}</option>`).join('')}</select></div>
        <div style="min-width:150px"><label class="field">Desde</label><input class="input" type="date" id="cruceDesde"></div>
        <div style="min-width:150px"><label class="field">Hasta</label><input class="input" type="date" id="cruceHasta"></div>
      </div>
      <div id="cruceResumen" style="margin-bottom:16px"></div>
      <h4 style="margin-bottom:8px">Productos entregados vs. facturados</h4>
      <table class="data-table"><thead><tr><th>Producto</th><th>Cant. entregada</th><th>Valor facturado</th></tr></thead><tbody id="cruceProdTbody"></tbody></table>
      <h4 style="margin:18px 0 8px">Mesas liquidadas — verificación de cuadre</h4>
      <table class="data-table"><thead><tr><th>Mesa</th><th>Mesero</th><th>Fecha</th><th>Suma de productos entregados</th><th>Subtotal facturado</th><th>Estado</th></tr></thead><tbody id="cruceMesasTbody"></tbody></table>
    `;
    ['cruceMeseroSel','cruceDesde','cruceHasta'].forEach(id=> document.getElementById(id).addEventListener('change', pintarCruceAdmin));
    pintarCruceAdmin();
  }
  if(tab==='inventario'){
    await cargarProductos();
    el.innerHTML = `<div class="row-between"><h4>Productos</h4><button class="btn btn-sm btn-brand" id="btnNuevoProdAdmin">+ Nuevo producto</button></div>
      <table class="data-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th></th></tr></thead><tbody id="invAdminTbody"></tbody></table>`;
    pintarInvAdmin();
    document.getElementById('btnNuevoProdAdmin').addEventListener('click', ()=> formularioProducto(null, {querySelector:()=>null}));
  }
  if(tab==='meseros'){
    const { data: ms } = await supa.from('meseros').select('*').eq('restaurante_id', state.restaurante.id).order('nombre');
    el.innerHTML = `<div class="row-between"><h4>Meseros</h4><button class="btn btn-sm btn-brand" id="btnNuevoMesero">+ Nuevo mesero</button></div>
      <table class="data-table"><thead><tr><th>Nombre</th><th>PIN</th><th>Activo</th><th></th></tr></thead><tbody>
      ${(ms||[]).map(m=>`<tr><td>${m.nombre}</td><td>${m.pin}</td><td>${m.activo?'Sí':'No'}</td><td><button class="btn btn-sm" data-editar-mesero="${m.id}">✏️</button></td></tr>`).join('')}
      </tbody></table>`;
    document.getElementById('btnNuevoMesero').addEventListener('click', ()=> formularioMesero(null));
    el.querySelectorAll('[data-editar-mesero]').forEach(b=> b.addEventListener('click', ()=> formularioMesero(b.getAttribute('data-editar-mesero'), ms)));
  }
  if(tab==='impuestos'){
    el.innerHTML = `<div class="row-between"><h4>Impuestos</h4><button class="btn btn-sm btn-brand" id="btnNuevoImpuesto">+ Nuevo impuesto</button></div>
      <p class="modal-sub" style="margin-bottom:10px">Se aplican automáticamente sobre el subtotal de cada cuenta, cliente y ticket.</p>
      <table class="data-table"><thead><tr><th>Nombre</th><th>Porcentaje</th><th>Activo</th><th></th></tr></thead><tbody id="impAdminTbody"></tbody></table>`;
    await pintarImpuestosAdmin();
    document.getElementById('btnNuevoImpuesto').addEventListener('click', ()=> formularioImpuesto(null));
  }
  if(tab==='config'){
    el.innerHTML = `<h4>Cambiar contraseña de administrador</h4>
      <label class="field">Contraseña actual</label><input class="input" id="cfgActual" type="password">
      <label class="field">Nueva contraseña</label><input class="input" id="cfgNueva" type="password">
      <button class="btn btn-brand" style="margin-top:14px" id="btnCambiarPass">Guardar nueva contraseña</button>`;
    document.getElementById('btnCambiarPass').addEventListener('click', async ()=>{
      if(document.getElementById('cfgActual').value !== state.adminPassword){ toast('Contraseña actual incorrecta','err'); return; }
      const nueva = document.getElementById('cfgNueva').value.trim();
      if(!nueva){ toast('Escribe la nueva contraseña','err'); return; }
      await supa.from('config_admin').update({password:nueva}).eq('id',1);
      state.adminPassword = nueva;
      toast('Contraseña actualizada');
    });
  }
}
function nombreMeseroCruce(id){
  return (state._cruceMeseros||[]).find(m=>m.id===id)?.nombre || 'Sin mesero';
}
function pintarCruceAdmin(){
  const selMesero = document.getElementById('cruceMeseroSel');
  if(!selMesero) return; // la pestaña ya no está visible
  const meseroId = selMesero.value;
  const desdeVal = document.getElementById('cruceDesde').value;
  const hastaVal = document.getElementById('cruceHasta').value;
  const desde = desdeVal ? new Date(desdeVal+'T00:00:00') : null;
  const hasta = hastaVal ? new Date(hastaVal+'T23:59:59') : null;

  const liq = (state._cruceLiq||[]).filter(l=>{
    if(meseroId && l.mesero_id !== meseroId) return false;
    const f = new Date(l.liquidada_en);
    if(desde && f < desde) return false;
    if(hasta && f > hasta) return false;
    return true;
  });

  // Cada mesa liquidada guarda en "cuentas" un snapshot de los productos que
  // el mesero registró como entregados en esa mesa (cuentas[].items). Esa es
  // la fuente de "lo entregado". La comparamos contra subtotal/total, que es
  // lo que realmente quedó facturado/cobrado.
  const porProducto = {};
  const filasMesas = [];
  liq.forEach(l=>{
    const cuentas = l.cuentas || [];
    let sumaItemsMesa = 0;
    cuentas.forEach(c=>{
      (c.items||[]).forEach(i=>{
        const cant = Number(i.cantidad)||0;
        const valor = cant * Number(i.precio_unitario||0);
        sumaItemsMesa += valor;
        const key = i.producto_nombre || 'Producto sin nombre';
        porProducto[key] = porProducto[key] || { cantidad:0, valor:0 };
        porProducto[key].cantidad += cant;
        porProducto[key].valor += valor;
      });
    });
    const subtotalRegistrado = l.subtotal!=null ? Number(l.subtotal) : sumaItemsMesa;
    const diferencia = Math.abs(sumaItemsMesa - subtotalRegistrado);
    filasMesas.push({
      mesa: l.mesa_nombre, mesero: nombreMeseroCruce(l.mesero_id), fecha: l.liquidada_en,
      sumaItems: sumaItemsMesa, subtotal: subtotalRegistrado, cuadra: diferencia < 1
    });
  });

  const conDiferencia = filasMesas.filter(f=>!f.cuadra);
  const quien = meseroId ? nombreMeseroCruce(meseroId) : 'los meseros';
  const resumen = document.getElementById('cruceResumen');
  resumen.innerHTML = filasMesas.length===0
    ? `<div class="card" style="padding:14px 16px;color:var(--muted)">Sin mesas liquidadas en el rango seleccionado.</div>`
    : conDiferencia.length===0
      ? `<div class="card" style="padding:14px 16px;border-color:var(--libre);color:var(--libre);display:flex;align-items:center;gap:10px"><span style="font-size:18px">✅</span><span>Todo lo facturado coincide con lo entregado por ${quien} (${filasMesas.length} mesas revisadas).</span></div>`
      : `<div class="card" style="padding:14px 16px;border-color:var(--danger);color:var(--danger);display:flex;align-items:center;gap:10px"><span style="font-size:18px">⚠️</span><span>${conDiferencia.length} de ${filasMesas.length} mesas tienen diferencias entre lo entregado y lo facturado. Revísalas en la tabla de abajo.</span></div>`;

  document.getElementById('cruceProdTbody').innerHTML = Object.entries(porProducto)
    .sort((a,b)=>b[1].valor-a[1].valor)
    .map(([nombre,d])=>`<tr><td>${nombre}</td><td>${d.cantidad}</td><td>${money(d.valor)}</td></tr>`)
    .join('') || '<tr><td colspan="3">Sin datos en el rango seleccionado</td></tr>';

  document.getElementById('cruceMesasTbody').innerHTML = filasMesas
    .map(f=>`<tr><td>${f.mesa}</td><td>${f.mesero}</td><td>${new Date(f.fecha).toLocaleString('es-CO')}</td><td>${money(f.sumaItems)}</td><td>${money(f.subtotal)}</td><td>${f.cuadra?'<span class="badge badge-libre">✅ Cuadra</span>':'<span class="badge badge-ocupada">⚠️ Diferencia</span>'}</td></tr>`)
    .join('') || '<tr><td colspan="6">Sin mesas en el rango seleccionado</td></tr>';
}
function pintarInvAdmin(){
  const tbody = document.getElementById('invAdminTbody');
  if(!tbody) return;
  tbody.innerHTML = state.productos.map(p=>`<tr><td>${p.nombre}</td><td>${p.categoria}</td><td>${money(p.precio)}</td><td><button class="btn btn-sm" data-ed="${p.id}">✏️</button></td></tr>`).join('');
  tbody.querySelectorAll('[data-ed]').forEach(b=> b.addEventListener('click', ()=> formularioProducto(b.getAttribute('data-ed'), {querySelector:()=>null})));
}
async function pintarImpuestosAdmin(){
  const tbody = document.getElementById('impAdminTbody');
  if(!tbody) return;
  const { data } = await supa.from('impuestos').select('*').eq('restaurante_id', state.restaurante.id).order('nombre');
  const lista = data || [];
  tbody.innerHTML = lista.map(i=>`<tr><td>${i.nombre}</td><td>${Number(i.porcentaje)}%</td><td>${i.activo?'Sí':'No'}</td><td><button class="btn btn-sm" data-ed-imp="${i.id}">✏️</button></td></tr>`).join('') || '<tr><td colspan="4">Sin impuestos configurados</td></tr>';
  tbody.querySelectorAll('[data-ed-imp]').forEach(b=> b.addEventListener('click', ()=> formularioImpuesto(b.getAttribute('data-ed-imp'), lista)));
}
function formularioImpuesto(id, listaActual){
  const i = id ? (listaActual||[]).find(x=>x.id===id) : null;
  const overlay = abrirModal(`
    <div class="modal-head"><h3>${i?'Editar':'Nuevo'} impuesto</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <label class="field">Nombre</label><input class="input" id="ifNombre" value="${i?i.nombre:''}" placeholder="Ej: IVA">
    <label class="field">Porcentaje (%)</label><input class="input" id="ifPorcentaje" type="number" step="0.01" value="${i?Number(i.porcentaje):0}">
    <label class="field">Activo</label><select class="input" id="ifActivo"><option value="true" ${!i||i.activo?'selected':''}>Sí</option><option value="false" ${i&&!i.activo?'selected':''}>No</option></select>
    <div style="display:flex;gap:8px;margin-top:16px">
      ${i?'<button class="btn btn-danger" id="ifEliminar">Eliminar</button>':''}
      <button class="btn btn-brand" style="flex:1" id="ifGuardar">Guardar</button>
    </div>
  `);
  document.getElementById('ifGuardar').addEventListener('click', async ()=>{
    const payload = {
      nombre: document.getElementById('ifNombre').value.trim(),
      porcentaje: Number(document.getElementById('ifPorcentaje').value)||0,
      activo: document.getElementById('ifActivo').value==='true',
      restaurante_id: state.restaurante.id
    };
    if(!payload.nombre){ toast('Escribe el nombre del impuesto','err'); return; }
    if(i) await supa.from('impuestos').update(payload).eq('id', i.id);
    else await supa.from('impuestos').insert(payload);
    await cargarImpuestos();
    cerrarModal(overlay);
    renderTab('impuestos');
    toast('Impuesto guardado');
  });
  if(i) document.getElementById('ifEliminar').addEventListener('click', async ()=>{
    await supa.from('impuestos').delete().eq('id', i.id);
    await cargarImpuestos();
    cerrarModal(overlay);
    renderTab('impuestos');
    toast('Impuesto eliminado');
  });
}
function formularioMesero(id, listaActual){
  const m = id ? (listaActual||[]).find(x=>x.id===id) : null;
  const overlay = abrirModal(`
    <div class="modal-head"><h3>${m?'Editar':'Nuevo'} mesero</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <label class="field">Nombre</label><input class="input" id="mfNombre" value="${m?m.nombre:''}">
    <label class="field">PIN</label><input class="input" id="mfPin" value="${m?m.pin:'1234'}">
    <label class="field">Activo</label><select class="input" id="mfActivo"><option value="true" ${m&&m.activo?'selected':''}>Sí</option><option value="false" ${m&&!m.activo?'selected':''}>No</option></select>
    <button class="btn btn-brand btn-block" style="margin-top:16px" id="mfGuardar">Guardar</button>
  `);
  document.getElementById('mfGuardar').addEventListener('click', async ()=>{
    const payload = { nombre: document.getElementById('mfNombre').value.trim(), pin: document.getElementById('mfPin').value.trim(), activo: document.getElementById('mfActivo').value==='true', restaurante_id: state.restaurante.id };
    if(m) await supa.from('meseros').update(payload).eq('id', m.id);
    else await supa.from('meseros').insert(payload);
    cerrarModal(overlay);
    renderTab('meseros');
    toast('Mesero guardado');
  });
}
function formularioRestaurante(id, esSuper){
  const r = id ? state.restaurantes.find(x=>x.id===id) : null;
  const overlay = abrirModal(`
    <div class="modal-head"><h3>${r?'Editar':'Nuevo'} restaurante</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <label class="field">Nombre</label><input class="input" id="rfNombre" value="${r?r.nombre:''}">
    <label class="field">Subdominio</label><input class="input" id="rfSub" value="${r?r.subdominio:''}" placeholder="ej: pizzeria">
    <button class="btn btn-brand btn-block" style="margin-top:16px" id="rfGuardar">Guardar</button>
  `);
  document.getElementById('rfGuardar').addEventListener('click', async ()=>{
    const payload = { nombre: document.getElementById('rfNombre').value.trim(), subdominio: document.getElementById('rfSub').value.trim().toLowerCase() };
    if(r) await supa.from('restaurantes').update(payload).eq('id', r.id);
    else await supa.from('restaurantes').insert(payload);
    const { data: rests } = await supa.from('restaurantes').select('*').order('nombre');
    state.restaurantes = rests || [];
    cerrarModal(overlay);
    if(esSuper) renderTabSuper('restaurantes'); else renderTab('restaurantes');
    toast('Restaurante guardado');
  });
}

/* =============================================================
   DASHBOARD ADMIN GENERAL (SUPERADMIN — todos los restaurantes)
   ============================================================= */
async function renderTabSuper(tab){
  const el = document.getElementById('superTabContent');
  if(!el) return;
  if(tab==='general'){
    el.innerHTML = '<p style="color:var(--muted)">Cargando…</p>';
    const { data: rests } = await supa.from('restaurantes').select('*').order('nombre');
    const restaurantes = rests || [];
    const { data: liqTodas } = await supa.from('mesas_liquidadas').select('*').order('liquidada_en',{ascending:false});
    const liq = liqTodas || [];
    const totalGeneral = liq.reduce((s,l)=>s+Number(l.total),0);
    const porRestaurante = {};
    liq.forEach(l=>{ porRestaurante[l.restaurante_id] = (porRestaurante[l.restaurante_id]||0) + Number(l.total); });
    const nombreRest = id => restaurantes.find(r=>r.id===id)?.nombre || 'Restaurante eliminado';
    el.innerHTML = `
      <div class="kpi-row">
        <div class="card kpi"><div class="num">${money(totalGeneral)}</div><div class="lbl">Total histórico (todos)</div></div>
        <div class="card kpi"><div class="num">${restaurantes.length}</div><div class="lbl">Restaurantes activos</div></div>
        <div class="card kpi"><div class="num">${liq.length}</div><div class="lbl">Mesas liquidadas</div></div>
      </div>
      <h4 style="margin-bottom:8px">Ventas por restaurante</h4>
      <table class="data-table"><thead><tr><th>Restaurante</th><th>Total facturado</th><th>Mesas liquidadas</th></tr></thead><tbody>
        ${restaurantes.map(r=>`<tr><td>${r.nombre}</td><td>${money(porRestaurante[r.id]||0)}</td><td>${liq.filter(l=>l.restaurante_id===r.id).length}</td></tr>`).join('') || '<tr><td colspan="3">Sin datos aún</td></tr>'}
      </tbody></table>
      <h4 style="margin:18px 0 8px">Últimas mesas liquidadas (todos los restaurantes)</h4>
      <table class="data-table"><thead><tr><th>Restaurante</th><th>Mesa</th><th>Fecha</th><th>Total</th></tr></thead><tbody>
        ${liq.slice(0,25).map(l=>`<tr><td>${nombreRest(l.restaurante_id)}</td><td>${l.mesa_nombre}</td><td>${new Date(l.liquidada_en).toLocaleString('es-CO')}</td><td>${money(l.total)}</td></tr>`).join('') || '<tr><td colspan="4">Sin datos aún</td></tr>'}
      </tbody></table>
    `;
  }
  if(tab==='restaurantes'){
    const { data: rests } = await supa.from('restaurantes').select('*').order('nombre');
    state.restaurantes = rests || [];
    el.innerHTML = `<div class="row-between"><h4>Restaurantes / subdominios</h4><button class="btn btn-sm btn-brand" id="btnNuevoRestSuper">+ Nuevo restaurante</button></div>
      <table class="data-table"><thead><tr><th>Nombre</th><th>Subdominio</th><th></th></tr></thead><tbody>
      ${state.restaurantes.map(r=>`<tr><td>${r.nombre}</td><td>${r.subdominio}.tudominio.com</td><td><button class="btn btn-sm" data-editar-rest-super="${r.id}">✏️</button></td></tr>`).join('')}
      </tbody></table>`;
    document.getElementById('btnNuevoRestSuper').addEventListener('click', ()=> formularioRestaurante(null, true));
    el.querySelectorAll('[data-editar-rest-super]').forEach(b=> b.addEventListener('click', ()=> formularioRestaurante(b.getAttribute('data-editar-rest-super'), true)));
  }
}

/* =============================================================
   ARRANCAR
   ============================================================= */
iniciar();
</script>
</body>
